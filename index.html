<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Classic Card &amp; Puzzle Games</title>
<meta name="description" content="Free, ad-free classic games that play right in your browser: Klondike Solitaire and Mahjong Solitaire." />
<meta name="theme-color" content="#141024" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Games" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <h1>Classic Card &amp; Puzzle Games</h1>
    <p>Free, ad-free, no accounts, no tracking. Pick a game.</p>
  </header>

  <main id="gameGrid">
    <a class="game-card card-solitaire" href="solitaire/">
      <span class="game-card-glow" aria-hidden="true"></span>
      <span class="game-card-emblem" aria-hidden="true">
        <span class="pip pip-spade">♠</span>
        <span class="pip pip-heart">♥</span>
      </span>
      <span class="game-card-body">
        <span class="game-card-title">Solitaire</span>
        <span class="game-card-subtitle">Classic Klondike</span>
      </span>
    </a>

    <a class="game-card card-mahjong" href="mahjong/">
      <span class="game-card-glow" aria-hidden="true"></span>
      <span class="game-card-emblem" aria-hidden="true">中</span>
      <span class="game-card-body">
        <span class="game-card-title">Mahjong</span>
        <span class="game-card-subtitle">Tile-Matching Solitaire</span>
      </span>
    </a>
  </main>

  <footer id="footer">Installable, works offline, no ads.</footer>

</div>
<script src="app.js"></script>
</body>
</html>
