<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mahjong Solitaire</title>
<meta name="description" content="A free, ad-free Mahjong Solitaire game that plays right in your browser." />
<meta name="theme-color" content="#7a1f2b" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mahjong" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="menuBtn" class="icon-btn" title="Menu" aria-label="Menu">☰</button>
    <div class="stats">
      <div class="stat"><span class="stat-label">Time</span><span id="timeVal">0:00</span></div>
      <div class="stat"><span class="stat-label">Tiles</span><span id="tilesLeftVal">144</span></div>
      <div class="stat"><span class="stat-label">Moves</span><span id="movesVal">0</span></div>
    </div>
    <div class="topbar-actions">
      <button id="hintBtn" class="icon-btn small" title="Hint" aria-label="Hint">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 21h6v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
      </button>
      <button id="shuffleBtn" class="icon-btn small" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="undoBtn" class="icon-btn small" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button id="newGameBtn" class="icon-btn small" title="New Game" aria-label="New Game">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 5v6h6v2h-6v6h-2v-6H5v-2h6V5h2z"/></svg>
      </button>
    </div>
  </header>

  <main id="boardWrap">
    <div id="board"></div>
  </main>

  <div id="toast" class="hidden"></div>

  <div id="fxLayer"></div>

  <div id="menuOverlay" class="overlay hidden">
    <div class="panel">
      <h2>麻將 Mahjong</h2>
      <div class="menu-row">
        <span>Full Screen</span>
        <div class="segmented" id="fullscreenSeg">
          <button data-mode="on" class="active">On</button>
          <button data-mode="off">Off</button>
        </div>
      </div>
      <div class="menu-row">
        <span>Sound</span>
        <div class="segmented" id="soundSeg">
          <button data-mode="off" class="active">Off</button>
          <button data-mode="on">On</button>
        </div>
      </div>
      <div class="menu-block">
        <span>Table</span>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-swatch active" data-theme="lacquer">
            <span class="theme-swatch-preview theme-preview-lacquer"></span>
            <span class="theme-swatch-label">Lacquer</span>
          </button>
          <button class="theme-swatch" data-theme="jade">
            <span class="theme-swatch-preview theme-preview-jade"></span>
            <span class="theme-swatch-label">Jade</span>
          </button>
          <button class="theme-swatch" data-theme="lantern">
            <span class="theme-swatch-preview theme-preview-lantern"></span>
            <span class="theme-swatch-label">Lantern</span>
          </button>
          <button class="theme-swatch" data-theme="ink">
            <span class="theme-swatch-preview theme-preview-ink"></span>
            <span class="theme-swatch-label">Ink Wash</span>
          </button>
        </div>
      </div>
      <p class="help-text">
        Tap a tile, then tap its match. Only tiles that are uncovered and
        open on the left or right can be picked.
      </p>
      <button id="closeMenuBtn" class="pill-btn">Close</button>
    </div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <div class="panel win-panel">
      <h2>🏮 Board Cleared! 🏮</h2>
      <p id="winStats"></p>
      <button id="playAgainBtn" class="pill-btn">Play Again</button>
    </div>
  </div>

  <div id="confirmOverlay" class="overlay hidden">
    <div class="panel">
      <h2>New Game?</h2>
      <p class="help-text confirm-text">Your current game will be lost.</p>
      <div class="confirm-row">
        <button id="confirmCancelBtn" class="pill-btn secondary-btn">Cancel</button>
        <button id="confirmYesBtn" class="pill-btn">Yes, New Game</button>
      </div>
    </div>
  </div>

</div>
<script src="game.js"></script>
</body>
</html>
